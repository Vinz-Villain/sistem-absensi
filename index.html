<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Absensi Digital</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#14161c;
    --bg-grid: rgba(234,231,223,0.025);
    --surface:#1b1e26;
    --surface-2:#22252f;
    --border:#2d3140;
    --border-soft:#262a35;
    --text:#eae7df;
    --text-dim:#9298a8;
    --text-faint:#5d6272;
    --brand:#ffb020;
    --brand-soft:rgba(255,176,32,0.14);
    --brand-dim:#8a6323;
    --hadir:#3ddc97;
    --hadir-soft:rgba(61,220,151,0.12);
    --izin:#f5c04a;
    --izin-soft:rgba(245,192,74,0.12);
    --sakit:#fb7484;
    --sakit-soft:rgba(251,116,132,0.12);
    --font-display:'Space Grotesk', sans-serif;
    --font-body:'Inter', sans-serif;
    --font-mono:'JetBrains Mono', monospace;
    --radius:14px;
  }

  *{ box-sizing:border-box; }

  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(1200px 500px at 15% -10%, rgba(255,176,32,0.06), transparent 60%),
      radial-gradient(900px 500px at 100% 0%, rgba(61,220,151,0.05), transparent 55%),
      var(--bg);
    color:var(--text);
    font-family:var(--font-body);
    padding:32px 20px 80px;
  }

  .app{
    max-width:920px;
    margin:0 auto;
  }

  /* ---------- Topbar ---------- */
  .topbar{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:20px;
    padding-bottom:28px;
    border-bottom:1px solid var(--border-soft);
    margin-bottom:28px;
    flex-wrap:wrap;
  }

  .brand{ display:flex; align-items:center; gap:14px; }

  .brand-mark{
    width:46px; height:46px;
    border-radius:12px;
    background:var(--surface-2);
    border:1px solid var(--border);
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
  }
  .brand-mark svg{ width:24px; height:24px; }

  .brand-text h1{
    font-family:var(--font-display);
    font-size:20px;
    font-weight:600;
    margin:0;
    letter-spacing:-0.01em;
  }
  .brand-text p{
    margin:2px 0 0;
    font-size:13px;
    color:var(--text-dim);
  }

  .clock-block{ text-align:right; }
  .clock{
    font-family:var(--font-mono);
    font-size:30px;
    font-weight:600;
    font-variant-numeric:tabular-nums;
    letter-spacing:0.03em;
    color:var(--brand);
    text-shadow:0 0 18px rgba(255,176,32,0.28);
    line-height:1;
  }
  .clock .blink{ animation:blink 1s steps(1) infinite; }
  @media (prefers-reduced-motion:reduce){ .clock .blink{ animation:none; } }
  @keyframes blink{ 50%{ opacity:0.25; } }

  .date-line{
    margin-top:6px;
    font-size:12.5px;
    color:var(--text-dim);
    text-transform:capitalize;
  }

  .mode-badge{
    display:inline-flex;
    align-items:center;
    gap:6px;
    margin-top:8px;
    font-size:11px;
    color:var(--izin);
    background:var(--izin-soft);
    border:1px solid rgba(245,192,74,0.3);
    padding:3px 9px;
    border-radius:100px;
    font-family:var(--font-mono);
  }
  .mode-badge .dot{ width:6px; height:6px; border-radius:50%; background:var(--izin); }
  .mode-badge[hidden]{ display:none; }

  /* ---------- Stat cards ---------- */
  .stats{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:14px;
    margin-bottom:24px;
  }
  .stat-card{
    background:var(--surface);
    border:1px solid var(--border-soft);
    border-left:3px solid var(--stat-color, var(--brand));
    border-radius:var(--radius);
    padding:16px 18px;
  }
  .stat-card .num{
    font-family:var(--font-display);
    font-size:28px;
    font-weight:700;
    line-height:1;
  }
  .stat-card .label{
    margin-top:6px;
    font-size:12.5px;
    color:var(--text-dim);
    display:flex;
    align-items:center;
    gap:6px;
  }
  .stat-card .label .sw{
    width:8px; height:8px; border-radius:2px;
    background:var(--stat-color, var(--brand));
  }

  /* ---------- Cards / sections ---------- */
  .card{
    background:var(--surface);
    border:1px solid var(--border-soft);
    border-radius:var(--radius);
    padding:22px;
    margin-bottom:20px;
  }
  .card-head{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:16px;
    gap:10px;
    flex-wrap:wrap;
  }
  .card-head h2{
    font-family:var(--font-display);
    font-size:15px;
    font-weight:600;
    margin:0;
    letter-spacing:0.01em;
  }
  .card-head .hint{ font-size:12px; color:var(--text-faint); }

  /* ---------- Form ---------- */
  .form-row{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    align-items:stretch;
  }
  .field-name{ flex:1 1 220px; min-width:180px; }

  input[type="text"]{
    width:100%;
    background:var(--surface-2);
    border:1px solid var(--border);
    color:var(--text);
    padding:12px 14px;
    border-radius:10px;
    font-size:14px;
    font-family:var(--font-body);
    outline:none;
    transition:border-color .15s ease;
  }
  input[type="text"]::placeholder{ color:var(--text-faint); }
  input[type="text"]:focus-visible{
    border-color:var(--brand);
    box-shadow:0 0 0 3px var(--brand-soft);
  }

  .segmented{
    display:flex;
    background:var(--surface-2);
    border:1px solid var(--border);
    border-radius:10px;
    padding:3px;
    gap:3px;
  }
  .seg-btn{
    border:none;
    background:transparent;
    color:var(--text-dim);
    font-family:var(--font-body);
    font-size:13px;
    font-weight:600;
    padding:9px 14px;
    border-radius:8px;
    cursor:pointer;
    transition:background .15s ease, color .15s ease;
    white-space:nowrap;
  }
  .seg-btn:focus-visible{ outline:2px solid var(--brand); outline-offset:1px; }
  .seg-btn[data-status="Hadir"].active{ background:var(--hadir-soft); color:var(--hadir); }
  .seg-btn[data-status="Izin"].active{ background:var(--izin-soft); color:var(--izin); }
  .seg-btn[data-status="Sakit"].active{ background:var(--sakit-soft); color:var(--sakit); }

  .btn-submit{
    border:none;
    background:var(--brand);
    color:#1a1406;
    font-family:var(--font-display);
    font-weight:600;
    font-size:14px;
    padding:0 22px;
    border-radius:10px;
    cursor:pointer;
    transition:filter .15s ease, transform .05s ease;
  }
  .btn-submit:hover{ filter:brightness(1.08); }
  .btn-submit:active{ transform:scale(0.98); }
  .btn-submit:focus-visible{ outline:2px solid var(--text); outline-offset:2px; }

  .form-error{
    margin-top:10px;
    font-size:12.5px;
    color:var(--sakit);
    display:none;
  }

  /* ---------- History list ---------- */
  .history-count{
    font-family:var(--font-mono);
    font-size:12px;
    color:var(--text-faint);
  }

  .row{
    display:grid;
    grid-template-columns:38px 1fr auto auto;
    align-items:center;
    gap:14px;
    padding:13px 4px;
    border-bottom:1px solid var(--border-soft);
  }
  .row:last-child{ border-bottom:none; }

  .avatar{
    width:38px; height:38px;
    border-radius:10px;
    background:var(--surface-2);
    border:1px solid var(--border);
    display:flex; align-items:center; justify-content:center;
    font-family:var(--font-display);
    font-weight:600;
    font-size:13px;
    color:var(--brand);
    flex-shrink:0;
  }

  .who .nama{ font-weight:600; font-size:14.5px; }
  .who .waktu{
    margin-top:2px;
    font-family:var(--font-mono);
    font-size:11.5px;
    color:var(--text-faint);
  }

  .stamp{
    font-family:var(--font-mono);
    font-size:11px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:0.06em;
    padding:5px 10px;
    border-radius:5px;
    border:1.5px dashed;
    transform:rotate(-2.5deg);
    white-space:nowrap;
    justify-self:start;
  }
  .stamp.Hadir{ color:var(--hadir); border-color:var(--hadir); background:var(--hadir-soft); }
  .stamp.Izin{ color:var(--izin); border-color:var(--izin); background:var(--izin-soft); }
  .stamp.Sakit{ color:var(--sakit); border-color:var(--sakit); background:var(--sakit-soft); }

  .status-select{
    background:var(--surface-2);
    border:1px solid var(--border);
    color:var(--text);
    font-family:var(--font-body);
    font-size:13px;
    padding:6px 8px;
    border-radius:7px;
  }

  .row-actions{ display:flex; gap:6px; }
  .icon-btn{
    width:32px; height:32px;
    border-radius:8px;
    border:1px solid var(--border);
    background:var(--surface-2);
    color:var(--text-dim);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    transition:border-color .15s ease, color .15s ease;
  }
  .icon-btn svg{ width:15px; height:15px; }
  .icon-btn:hover{ color:var(--text); border-color:var(--text-faint); }
  .icon-btn.danger:hover{ color:var(--sakit); border-color:var(--sakit); }
  .icon-btn:focus-visible{ outline:2px solid var(--brand); outline-offset:1px; }
  .icon-btn.confirm{ background:var(--hadir-soft); color:var(--hadir); border-color:var(--hadir); }
  .icon-btn.cancel{ background:var(--sakit-soft); color:var(--sakit); border-color:var(--sakit); }

  /* ---------- Empty state ---------- */
  .empty{
    text-align:center;
    padding:36px 20px;
    color:var(--text-dim);
  }
  .empty .ic{ font-size:26px; margin-bottom:8px; opacity:0.6; }
  .empty p{ margin:0; font-size:13.5px; }
  .empty span{ color:var(--text-faint); font-size:12px; }

  /* ---------- Responsive ---------- */
  @media (max-width:640px){
    .stats{ grid-template-columns:1fr; }
    .row{
      grid-template-columns:38px 1fr;
      grid-template-areas:
        "avatar who"
        "stamp stamp"
        "actions actions";
      row-gap:8px;
    }
    .row .avatar{ grid-area:avatar; }
    .row .who{ grid-area:who; }
    .row .stamp{ grid-area:stamp; }
    .row .row-actions{ grid-area:actions; justify-content:flex-end; }
    .clock{ font-size:24px; }
    .topbar{ flex-direction:column; }
    .clock-block{ text-align:left; }
  }
</style>
</head>
<body>

<div class="app">

  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="#ffb020" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="9"/>
          <path d="M12 7v5l3.2 1.8"/>
        </svg>
      </div>
      <div class="brand-text">
        <h1>Absensi Digital</h1>
        <p>Catatan kehadiran harian</p>
      </div>
    </div>
    <div class="clock-block">
      <div class="clock" id="clock">--:--:--</div>
      <div class="date-line" id="dateLine">memuat tanggal…</div>
      <div class="mode-badge" id="modeBadge" hidden>
        <span class="dot"></span> Mode demo lokal
      </div>
    </div>
  </header>

  <section class="stats">
    <div class="stat-card" style="--stat-color: var(--hadir)">
      <div class="num" id="statHadir">0</div>
      <div class="label"><span class="sw"></span>Hadir hari ini</div>
    </div>
    <div class="stat-card" style="--stat-color: var(--izin)">
      <div class="num" id="statIzin">0</div>
      <div class="label"><span class="sw"></span>Izin hari ini</div>
    </div>
    <div class="stat-card" style="--stat-color: var(--sakit)">
      <div class="num" id="statSakit">0</div>
      <div class="label"><span class="sw"></span>Sakit hari ini</div>
    </div>
  </section>

  <section class="card">
    <div class="card-head">
      <h2>Catat kehadiran</h2>
      <span class="hint">Isi nama, pilih status, lalu kirim</span>
    </div>
    <div class="form-row">
      <div class="field-name">
        <input type="text" id="inputNama" placeholder="Nama lengkap" autocomplete="off">
      </div>
      <div class="segmented" id="segStatus" role="group" aria-label="Pilih status">
        <button type="button" class="seg-btn active" data-status="Hadir">Hadir</button>
        <button type="button" class="seg-btn" data-status="Izin">Izin</button>
        <button type="button" class="seg-btn" data-status="Sakit">Sakit</button>
      </div>
      <button class="btn-submit" onclick="tambahAbsen()">Kirim Absen</button>
    </div>
    <div class="form-error" id="formError">Nama tidak boleh kosong.</div>
  </section>

  <section class="card">
    <div class="card-head">
      <h2>Riwayat absensi</h2>
      <span class="history-count" id="historyCount">0 catatan</span>
    </div>
    <div id="tabelData"></div>
  </section>

</div>

<script>
  const urlAPI = '/api/absen';
  let localMode = false;
  let selectedStatus = 'Hadir';

  // Seed data used only if the local API can't be reached, so the page
  // still demonstrates real behaviour standalone.
  let localData = [
    { id: 1, nama: 'Siti Rahma', status: 'Hadir', waktu: new Date().setHours(7,52,0,0) },
    { id: 2, nama: 'Budi Santoso', status: 'Izin', waktu: new Date().setHours(8,4,0,0) },
    { id: 3, nama: 'Dewi Anggraini', status: 'Sakit', waktu: new Date().setHours(8,10,0,0) },
  ];
  let localNextId = 4;

  const iconPencil = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3l4 4L7 21H3v-4L17 3z"/></svg>`;
  const iconSwap = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h13l-3-3M20 17H7l3 3"/></svg>`;
  const iconTrash = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3m-8 0l1 13h8l1-13"/></svg>`;

  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function initials(nama){
    return nama.trim().split(/\s+/).slice(0,2).map(w => w[0]?.toUpperCase() || '').join('');
  }

  // ---------- Live clock ----------
  function tickClock(){
    const now = new Date();
    const hh = String(now.getHours()).padStart(2,'0');
    const mm = String(now.getMinutes()).padStart(2,'0');
    const ss = String(now.getSeconds()).padStart(2,'0');
    document.getElementById('clock').innerHTML = `${hh}<span class="blink">:</span>${mm}<span class="blink">:</span>${ss}`;
    document.getElementById('dateLine').textContent =
      now.toLocaleDateString('id-ID', { weekday:'long', day:'numeric', month:'long', year:'numeric' });
  }
  tickClock();
  setInterval(tickClock, 1000);

  // ---------- Segmented control ----------
  document.getElementById('segStatus').addEventListener('click', (e) => {
    const btn = e.target.closest('.seg-btn');
    if(!btn) return;
    document.querySelectorAll('.seg-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    selectedStatus = btn.dataset.status;
  });

  // ---------- Read ----------
  async function ambilData(){
    try{
      const respon = await fetch(urlAPI);
      if(!respon.ok) throw new Error('status tidak ok');
      const data = await respon.json();
      localMode = false;
      renderTable(data);
    }catch(e){
      localMode = true;
      renderTable(localData);
    }
    document.getElementById('modeBadge').hidden = !localMode;
  }

  function renderTable(data){
    const sorted = [...data].sort((a,b) => new Date(b.waktu) - new Date(a.waktu));
    const container = document.getElementById('tabelData');
    document.getElementById('historyCount').textContent =
      `${data.length} catatan`;

    if(data.length === 0){
      container.innerHTML = `
        <div class="empty">
          <div class="ic">◯</div>
          <p>Belum ada catatan kehadiran.</p>
          <span>Gunakan formulir di atas untuk mencatat kehadiran pertama.</span>
        </div>`;
    } else {
      container.innerHTML = sorted.map(item => `
        <div class="row">
          <div class="avatar">${escapeHtml(initials(item.nama))}</div>
          <div class="who">
            <div class="nama">${escapeHtml(item.nama)}</div>
            <div class="waktu">${new Date(item.waktu).toLocaleString('id-ID', { dateStyle:'medium', timeStyle:'short' })}</div>
          </div>
          <div class="stamp ${item.status}" id="kolom-status-${item.id}">${item.status}</div>
          <div class="row-actions" id="aksi-${item.id}">
            <button class="icon-btn" title="Ubah nama" onclick="editNama(${item.id}, '${escapeHtml(item.nama)}', '${item.status}')">${iconPencil}</button>
            <button class="icon-btn" title="Ubah status" onclick="tampilkanPilihanStatus(${item.id}, '${escapeHtml(item.nama)}', '${item.status}')">${iconSwap}</button>
            <button class="icon-btn danger" title="Hapus" onclick="hapusAbsen(${item.id})">${iconTrash}</button>
          </div>
        </div>
      `).join('');
    }

    // Today's stats
    const todayStr = new Date().toDateString();
    const todays = data.filter(item => new Date(item.waktu).toDateString() === todayStr);
    document.getElementById('statHadir').textContent = todays.filter(i => i.status === 'Hadir').length;
    document.getElementById('statIzin').textContent = todays.filter(i => i.status === 'Izin').length;
    document.getElementById('statSakit').textContent = todays.filter(i => i.status === 'Sakit').length;
  }

  // ---------- Create ----------
  async function tambahAbsen(){
    const inputNama = document.getElementById('inputNama');
    const nama = inputNama.value.trim();
    const errorEl = document.getElementById('formError');

    if(!nama){
      errorEl.style.display = 'block';
      inputNama.focus();
      return;
    }
    errorEl.style.display = 'none';

    if(localMode){
      localData.push({ id: localNextId++, nama, status: selectedStatus, waktu: Date.now() });
    } else {
      try{
        await fetch(urlAPI, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ nama, status: selectedStatus })
        });
      }catch(e){
        localMode = true;
        localData.push({ id: localNextId++, nama, status: selectedStatus, waktu: Date.now() });
      }
    }

    inputNama.value = '';
    ambilData();
  }

  // ---------- Update name ----------
  async function editNama(id, namaLama, statusSaatIni){
    const namaBaru = prompt('Ubah nama:', namaLama);
    if(namaBaru === null || !namaBaru.trim()) return;

    if(localMode){
      const rec = localData.find(i => i.id === id);
      if(rec) rec.nama = namaBaru.trim();
    } else {
      try{
        await fetch(`${urlAPI}/${id}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ nama: namaBaru.trim(), status: statusSaatIni })
        });
      }catch(e){ /* stays in server mode; next refresh will surface any issue */ }
    }
    ambilData();
  }

  // ---------- Inline status editor ----------
  function tampilkanPilihanStatus(id, namaSaatIni, statusLama){
    const kolomStatus = document.getElementById(`kolom-status-${id}`);
    const kolomAksi = document.getElementById(`aksi-${id}`);

    kolomStatus.outerHTML = `
      <select class="status-select" id="pilih-status-${id}">
        <option value="Hadir" ${statusLama === 'Hadir' ? 'selected' : ''}>Hadir</option>
        <option value="Izin" ${statusLama === 'Izin' ? 'selected' : ''}>Izin</option>
        <option value="Sakit" ${statusLama === 'Sakit' ? 'selected' : ''}>Sakit</option>
      </select>`;

    kolomAksi.innerHTML = `
      <button class="icon-btn confirm" title="Simpan" onclick="simpanStatusBaru(${id}, '${escapeHtml(namaSaatIni)}')">✓</button>
      <button class="icon-btn cancel" title="Batal" onclick="ambilData()">✕</button>`;
  }

  async function simpanStatusBaru(id, namaSaatIni){
    const statusBaru = document.getElementById(`pilih-status-${id}`).value;

    if(localMode){
      const rec = localData.find(i => i.id === id);
      if(rec) rec.status = statusBaru;
    } else {
      try{
        await fetch(`${urlAPI}/${id}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ nama: namaSaatIni, status: statusBaru })
        });
      }catch(e){ /* ignore, refresh will reconcile */ }
    }
    ambilData();
  }

  // ---------- Delete ----------
  async function hapusAbsen(id){
    if(!confirm('Yakin ingin menghapus catatan ini?')) return;

    if(localMode){
      localData = localData.filter(i => i.id !== id);
    } else {
      try{
        await fetch(`${urlAPI}/${id}`, { method: 'DELETE' });
      }catch(e){ /* ignore */ }
    }
    ambilData();
  }

  document.getElementById('inputNama').addEventListener('keydown', (e) => {
    if(e.key === 'Enter') tambahAbsen();
  });

  ambilData();
</script>

</body>
</html>
